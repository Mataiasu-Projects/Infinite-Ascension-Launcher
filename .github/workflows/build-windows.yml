name: Build Windows Launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Validate canonical launcher sources
        shell: pwsh
        run: |
          $required = @(
            'src/Program.cs',
            'src/LauncherSelfUpdater.cs',
            'src/InfiniteAscensionLauncher.csproj'
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Missing canonical launcher source: $path" }
          }
          $project = Get-Content 'src/InfiniteAscensionLauncher.csproj' -Raw
          if ($project -notmatch 'Compile Include="Program\.cs"') { throw 'Program.cs is not compiled.' }
          if ($project -notmatch 'Compile Include="LauncherSelfUpdater\.cs"') { throw 'LauncherSelfUpdater.cs is not compiled.' }
          if ($project -match 'LauncherV3\.cs|LauncherV3Form') { throw 'Legacy LauncherV3 code must not be compiled.' }

      - name: Publish launcher
        shell: pwsh
        run: |
          dotnet publish src/InfiniteAscensionLauncher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=true -p:DebugType=None -p:DebugSymbols=false -o artifacts/launcher-windows

      - name: Verify launcher artifact
        shell: pwsh
        run: |
          $exe = 'artifacts/launcher-windows/Infinite-Ascension-Launcher.exe'
          $buildInfo = 'artifacts/launcher-windows/launcher_build.json'
          if (-not (Test-Path $exe)) { throw 'Launcher executable was not produced.' }
          if (-not (Test-Path $buildInfo)) { throw 'launcher_build.json was not produced.' }
          $bytes = [IO.File]::ReadAllBytes($exe)
          if ($bytes.Length -lt 10MB) { throw 'Launcher executable is unexpectedly small.' }
          if ($bytes[0] -ne 0x4D -or $bytes[1] -ne 0x5A) { throw 'Launcher executable is not a valid Windows PE file.' }
          $info = Get-Content $buildInfo -Raw | ConvertFrom-Json
          if ($info.platform -ne 'windows') { throw 'launcher_build.json platform is not windows.' }
          if ([string]::IsNullOrWhiteSpace([string]$info.build)) { throw 'launcher_build.json build is empty.' }
          if ([string]::IsNullOrWhiteSpace([string]$info.commit)) { throw 'launcher_build.json commit is empty.' }
          $utf8 = [Text.Encoding]::UTF8.GetString($bytes)
          $utf16 = [Text.Encoding]::Unicode.GetString($bytes)
          if (($utf8 -match 'LauncherV3Form') -or ($utf16 -match 'LauncherV3Form')) { throw 'Legacy LauncherV3Form detected in launcher binary.' }
          Get-FileHash $exe -Algorithm SHA256 | Format-List

      - name: Smoke test launcher process
        shell: pwsh
        run: |
          $env:INFINITE_ASCENSION_SKIP_SELF_UPDATE = '1'
          $exe = (Resolve-Path 'artifacts/launcher-windows/Infinite-Ascension-Launcher.exe').Path
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) {
            throw "Launcher exited during smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force

      - name: Package launcher release
        shell: pwsh
        run: |
          $zip = 'artifacts/Infinite-Ascension-Launcher-Windows.zip'
          Compress-Archive -Path 'artifacts/launcher-windows/*' -DestinationPath $zip -Force
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash
          "$hash  Infinite-Ascension-Launcher-Windows.zip" | Set-Content 'artifacts/SHA256SUMS.txt' -Encoding ASCII

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ github.run_number }}"
          gh release create $tag `
            'artifacts/Infinite-Ascension-Launcher-Windows.zip' `
            'artifacts/SHA256SUMS.txt' `
            --repo '${{ github.repository }}' `
            --title "Infinite Ascension Launcher $tag" `
            --generate-notes `
            --latest
